  <style>
    .gl { max-width: 980px; }

    .gl-filter button { font: inherit; font-size: .85rem; padding: 5px 12px; border-radius: 99px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); cursor: pointer; }

    .gl-letters { display: flex; flex-wrap: wrap; gap: 2px; }

    .gl-letters a { color: var(--ink-2); }
    .gl-letters a:hover { background: var(--surface-2); color: var(--ink); }
    .gl-letters span { color: var(--line-2); }

    .gl-list { margin: 0; display: grid; gap: 0; }
    .gl-item { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr); gap: 4px 20px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
    @media (max-width: 640px) { .gl-item { grid-template-columns: minmax(0, 1fr); } }
    .gl-item dt { font-weight: 700; }
    .gl-item dd { margin: 0; color: var(--ink-2); }
    .gl-item dd a.gl-src { font-family: var(--font-mono); font-size: .75rem; margin-left: 6px; text-decoration: none; white-space: nowrap; }
    .gl-item dd a.gl-src:hover { text-decoration: underline; }
    mark { background: color-mix(in srgb, var(--accent) 22%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
    .gl-empty { padding: 32px 0; color: var(--ink-3); }
    #gl-cards { margin-top: 18px; }
  </style>
</head>
<body data-page="glossary">
<main id="main">
  <div class="gl">
    <header class="module-hero" style="margin-bottom: 16px;">
      <p class="eyebrow"><span class="tag" style="color: var(--accent)">Reference</span><span id="gl-total"></span></p>
      <h1>Glossary</h1>
      <p class="lede">Every key term from the course, in plain language. Search it, filter by chapter, jump to the section that teaches it, or turn your filtered list into flashcards.</p>

    <div class="gl-controls">
      <div class="gl-row">
        <label class="sr-only" for="gl-q">Search terms</label>

      <div class="gl-row">
        <div class="gl-filter cluster" role="group" aria-label="Filter by module" id="gl-filter"></div>
        <span class="gl-count" id="gl-count" aria-live="polite"></span>
      </div>
      <nav class="gl-letters" id="gl-letters" aria-label="Jump to letter"></nav>
    </div>

    <div id="gl-cards" hidden></div>
    <div id="gl-out"></div>
  </div>
</main>

WD1.ready(() => {
  const { $, h } = WD1;
  const MODS = WD1.MODULES;
  const modOf = (id) => MODS.find((m) => m.id === id);
  let filter = 'all';

  const terms = GLOSSARY.map(([term, def, mod, sec]) => ({ term, def, mod, sec, key: term.replace(/^[^A-Za-z0-9]+/, '').toUpperCase() }))
    .sort((a, b) => a.key.localeCompare(b.key));
  $('#gl-total').textContent = terms.length + ' terms';

  const fil = $('#gl-filter');
  [['all', 'All']].concat(MODS.map((m) => [m.id, m.num === 'L' ? 'Level Up' : 'Ch ' + m.num])).forEach(([id, label]) => {
    fil.appendChild(h('button', { type: 'button', 'aria-pressed': String(id === filter), text: label, dataset: { f: id },
      onclick: () => { filter = id; [...fil.children].forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.f === id))); render(); } }));
  });

  const esc = WD1.esc;
  const hi = (html, q) => {
    if (!q) return html;
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    // Only highlight text outside tags
    return html.split(/(<[^>]+>|&[#\w]+;)/).map((part) => /^[<&]/.test(part) ? part : part.replace(re, '<mark>$1</mark>')).join('');
  };

  function current() {
    const q = $('#gl-q').value.trim().toLowerCase();
    return { q, list: terms.filter((t) => (filter === 'all' || t.mod === filter) && (!q || t.term.toLowerCase().includes(q) || t.def.toLowerCase().includes(q))) };
  }

  function render() {
    const { q, list } = current();
    const out = $('#gl-out');
    out.innerHTML = '';
    $('#gl-count').textContent = list.length + ' of ' + terms.length + ' terms';
    const letters = $('#gl-letters');
    letters.innerHTML = '';
    const groups = new Map();
    list.forEach((t) => { const L = /[A-Z]/.test(t.key[0]) ? t.key[0] : '#'; if (!groups.has(L)) groups.set(L, []); groups.get(L).push(t); });
    'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach((L) => {
      letters.appendChild(groups.has(L) ? h('a', { href: '#gl-' + L, text: L }) : h('span', { text: L, 'aria-hidden': 'true' }));
    });
    if (!list.length) { out.appendChild(h('p', { class: 'gl-empty', text: 'No terms match. Try a shorter search or another chapter.' })); return; }
    groups.forEach((items, L) => {
      out.appendChild(h('section', { class: 'gl-group', id: 'gl-' + L, 'aria-label': 'Terms starting with ' + L },
        h('h2', { text: L }),
        h('dl', { class: 'gl-list' }, items.map((t) => {
          const m = modOf(t.mod), s = WD1.section(t.sec);
          return h('div', { class: 'gl-item' },
            h('dt', { html: hi(esc(t.term), q) }),
            h('dd', null,
              h('span', { html: hi(WD1.fmt(t.def), q) }),
              s ? h('a', { class: 'gl-src', href: m.href + '#' + s.id, style: { color: 'var(--' + (t.mod === 'levelup' ? 'chl' : t.mod) + ')' }, text: (s.num === 'R' ? m.label : s.num) + ' →' }) : null));
        }))));
    });
    if (!$('#gl-cards').hidden) study();
  }

  function study() {
    const { list } = current();
    const box = $('#gl-cards');
    box.hidden = false;
    box.innerHTML = '';
    const el = h('div', { dataset: { title: 'Study ' + list.length + ' term' + (list.length === 1 ? '' : 's') } });
    box.appendChild(el);
    WD1.flashcards(el, WD1.shuffle(list).map((t) => ({ front: t.term, back: t.def })));
    $('#gl-study').textContent = 'Hide flashcards';
  }
  $('#gl-study').addEventListener('click', () => {
    const box = $('#gl-cards');
    if (!box.hidden) { box.hidden = true; box.innerHTML = ''; $('#gl-study').textContent = 'Study as flashcards'; return; }
    study();
    box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  let t;
  $('#gl-q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(render, 120); });
  render();
});
</script>
</body>
